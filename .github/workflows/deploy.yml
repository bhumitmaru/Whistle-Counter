name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set GitHub Pages paths
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo_name" == "$GITHUB_REPOSITORY_OWNER.github.io" ]]; then
            base_path="/"
            site_url="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          else
            base_path="/$repo_name/"
            site_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/$repo_name"
          fi
          echo "BASE_PATH=$base_path" >> "$GITHUB_ENV"
          echo "SITE_URL=$site_url" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ secrets.PAGES_TOKEN }}
          
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
